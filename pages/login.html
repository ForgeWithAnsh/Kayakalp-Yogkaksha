<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Kayakalp Yog Kaksha</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/login.css">

</head>

<body>

    <!-- Background -->

    <div class="background paper-background"></div>


    <!-- ==========================================================
         LOGIN PAGE
    ========================================================== -->

    <main class="login-page">

        <!-- ==========================================================
             BRAND
        ========================================================== -->

        <section class="brand-section">

            <span class="brand-logo brand-mark" aria-hidden="true">ॐ</span>

            <h1>

                Kayakalp

            </h1>

            <h2>

                Yog Kaksha

            </h2>

            <p class="brand-tagline">

                Transforming Lives,
                One Breath At A Time.

            </p>

        </section>


        <!-- ==========================================================
             LOGIN CARD
        ========================================================== -->

        <section class="login-card">

            <p class="login-greeting">

                Welcome Back 👋

            </p>

            <p class="login-description">

                Continue your yoga journey.

            </p>


            <!-- Email -->

            <form id="loginForm">
<div class="input-group">

                <label for="emailInput">

                    Email Address

                </label>

                <input
                    type="email"
                    id="emailInput" required autocomplete="email"
                    placeholder="Enter your email">

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="passwordInput">

                    Password

                </label>

                <div class="password-wrapper">

    <input
        type="password"
        id="passwordInput" required autocomplete="current-password"
        placeholder="Enter your password">

    <button
        type="button"
        id="togglePassword"
        class="eye-button"
        aria-label="Show Password">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
    <circle cx="12" cy="12" r="3"></circle>
    <path class="password-visibility-slash" d="M3 3l18 18"></path>
</svg>
</button>

</div>

            </div>


            <!-- Forgot Password -->

            <div class="forgot-password">

                <button
                    id="forgotPasswordButton" type="button">

                    Forgot Password?

                </button>

            </div>


            <!-- Firebase Error -->

            <p
                id="loginError" role="status"
                class="login-error">

            </p>


            <!-- Continue -->

            <button
                id="loginButton" type="submit"
                class="primary-button">

                <span id="loginButtonText" class="account-button-label">

                    Continue

                </span>

                <span
                    id="loginLoader" aria-hidden="true"
                    class="button-loader">

                </span>

            </button>
        </form>


            <!-- Divider -->

            <div class="divider">

                <span>

                    OR

                </span>

            </div>


            <!-- Join -->

            <button
                id="createAccountButton" type="button"
                class="secondary-button">

                Join Kayakalp Yog Kaksha

            </button>

        </section>


        <!-- ==========================================================
             FOOTER
        ========================================================== -->

        <footer class="login-footer">

            <p>

                Every Breath Is A New Beginning

            </p>

            <span>

                Version 1.0

            </span>

        </footer>

    </main>

    <script type="module" src="../js/login.js"></script>
</body>

</html>
