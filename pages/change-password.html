<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Change Password</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/change-password.css">

</head>

<body>

    <!-- Background -->

    <div class="background paper-background"></div>

    <div class="change-password-content">

        <!-- Header -->

        <header class="change-password-header">

            <button
                class="back-button"
                id="backButton">

                ←

            </button>

            <h1>

                Change Password

            </h1>

        </header>


        <!-- Password Card -->

        <section class="password-card">

            <label>

                Current Password

            </label>

            <input
                type="password"
                id="currentPassword"
                placeholder="Enter current password">


            <label>

                New Password

            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password">


            <label>

                Confirm Password

            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Re-enter new password">


            <label class="show-password">

                <input
                    type="checkbox"
                    id="showPassword">

                <span>

                    Show Passwords

                </span>

            </label>

        </section>


        <!-- Change Password Button -->

        <button
            class="change-password-button"
            id="changePasswordButton">

            Change Password

        </button>

    </div>

<!-- ==========================================================
     MESSAGE POPUP
========================================================== -->

<div
    class="popup-overlay"
    id="messagePopupOverlay">

    <div class="popup-card">

        <div
            class="popup-icon"
            id="popupIcon">

            ✅

        </div>

        <h2
            id="popupTitle">

            Success

        </h2>

        <p
            id="popupMessage">

            Message

        </p>

        <button
            class="popup-button"
            id="popupButton">

            OK

        </button>

    </div>

</div>

    <script src="../js/change-password.js"></script>

</body>

</html>
