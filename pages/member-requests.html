<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Member Requests | Kayakalp Yogkaksha</title>
    <link rel="stylesheet" href="../css/member-requests.css">
    <link rel="stylesheet" href="../css/access.css">
    <script type="module" src="../js/page-access.js"></script>
</head>
<body data-access="admin">
    <section class="access-status" aria-label="Account access">
        <p role="status">Checking your account…</p>
        <div class="access-status__actions" hidden>
            <button type="button" data-retry>Try again</button>
            <button type="button" data-sign-out>Sign out</button>
        </div>
    </section>
    <main class="memberRequestsPage">
        <header class="topBar">
            <a class="backButton" href="../index.html" aria-label="Back to home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                    <path d="M15 18l-6-6 6-6"/>
                </svg>
            </a>
            <div>
                <h1>Member Requests</h1>
                <p>Review and manage new member requests</p>
            </div>
        </header>

        <nav class="requestTabs" aria-label="Request status">
            <button class="tabButton active" type="button" data-status="pending" aria-pressed="true">Pending</button>
            <button class="tabButton" type="button" data-status="approved" aria-pressed="false">Approved</button>
            <button class="tabButton" type="button" data-status="rejected" aria-pressed="false">Rejected</button>
        </nav>

        <p id="requestStatus" class="requestCount" role="status">Loading requests…</p>
        <p id="requestActionStatus" class="requestActionStatus" role="status"></p>
        <div id="requestsContainer"></div>
    </main>

    <template id="requestCardTemplate">
        <article class="requestCard">
            <h2 class="requestName">
                <button class="requestDetailsButton" type="button"></button>
            </h2>
            <p class="requestInfo"></p>
            <div class="requestActions" hidden>
                <button class="approveButton" type="button">Approve</button>
                <button class="rejectButton" type="button">Reject</button>
            </div>
        </article>
    </template>

    <dialog id="detailsOverlay" class="requestDetailsDialog" aria-labelledby="popupName">
        <div class="detailsPopup">
            <button id="closePopupButton" class="closePopupButton" type="button" aria-label="Close details">×</button>
            <div class="popupHeader">
                <span id="requestAvatar" class="request-avatar" aria-hidden="true"></span>
                <h2 id="popupName"></h2>
            </div>
            <dl class="popupDetails">
                <div class="detailRow"><dt>Email</dt><dd id="popupEmail"></dd></div>
                <div class="detailRow"><dt>Phone</dt><dd id="popupPhone"></dd></div>
                <div class="detailRow"><dt>Gender</dt><dd id="popupGender"></dd></div>
                <div class="detailRow"><dt>Date of birth</dt><dd id="popupDob"></dd></div>
                <div class="detailRow"><dt>Address</dt><dd id="popupAddress"></dd></div>
                <div class="detailRow"><dt>Location</dt><dd id="popupPark"></dd></div>
                <div class="detailRow"><dt>Health information</dt><dd id="popupHealth"></dd></div>
            </dl>
        </div>
    </dialog>

    <script type="module" src="../js/member-requests.js"></script>
</body>
</html>
