<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Kayakalp Yogkaksha</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/attendance.css">
    <link rel="stylesheet" href="../css/access.css">
    <script type="module" src="../js/page-access.js"></script>
</head>
<body data-access="attendance">
    <section class="access-status" aria-label="Account access">
        <p role="status">Checking your account…</p>
        <div class="access-status__actions" hidden>
            <button type="button" data-retry>Try again</button>
            <button type="button" data-sign-out>Sign out</button>
        </div>
    </section>
    <div class="background paper-background"></div>

    <main class="attendance-page app-content">
        <header class="attendance-header">
            <a class="attendance-back" href="../index.html" aria-label="Back to home">←</a>
            <div>
                <h1>Attendance</h1>
                <p id="attendance-scope"></p>
            </div>
            <button id="mark-attendance" class="attendance-primary" type="button" hidden>Mark attendance</button>
        </header>

        <p id="attendance-message" class="attendance-message" role="status">Checking access…</p>

        <div id="attendance-content" hidden>
            <div class="attendance-filters">
                <label class="attendance-field">
                    Date (IST)
                    <input id="attendance-date" type="date" required>
                </label>
                <label id="attendance-location-filter" class="attendance-field">
                    Location
                    <select id="attendance-location">
                        <option value="">All Locations</option>
                    </select>
                </label>
                <button id="refresh-attendance" class="attendance-secondary" type="button">Refresh</button>
            </div>

            <section class="attendance-summary-section" aria-labelledby="attendance-summary-title">
                <h2 id="attendance-summary-title">Summary</h2>
                <div id="session-status-card" class="session-status-card">
                    <span class="session-status-icon" aria-hidden="true">🧘</span>
                    <div>
                        <strong id="session-status-title"></strong>
                        <p id="session-status-message"></p>
                    </div>
                </div>
                <dl id="attendance-totals" class="attendance-summary">
                    <div class="summary-item">
                        <dt>Present</dt>
                        <dd id="attendance-present">—</dd>
                    </div>
                    <div class="summary-item">
                        <dt>Short</dt>
                        <dd id="attendance-short">—</dd>
                    </div>
                    <div class="summary-item">
                        <dt>Absent</dt>
                        <dd id="attendance-absent">—</dd>
                    </div>
                    <div class="summary-item">
                        <dt>Members</dt>
                        <dd id="attendance-total">—</dd>
                    </div>
                </dl>
            </section>

            <section aria-labelledby="attendance-members-title">
                <h2 id="attendance-members-title">Members</h2>
                <div class="attendance-filters">
                    <label class="attendance-field attendance-search-field">
                        Search
                        <input id="attendance-search" type="search" placeholder="Name or member ID">
                    </label>
                    <label class="attendance-field">
                        Status
                        <select id="attendance-status-filter">
                            <option value="">All statuses</option>
                            <option value="present">Present</option>
                            <option value="short">Short</option>
                            <option value="absent">Absent</option>
                            <option value="active">Active</option>
                            <option value="paused">Paused</option>
                            <option value="unmarked">Unmarked</option>
                        </select>
                    </label>
                </div>
                <p id="attendance-empty" class="attendance-message" hidden></p>
                <ul id="attendance-members" class="attendance-members"></ul>
                <nav id="attendance-pagination" class="attendance-pagination" aria-label="Attendance pages" hidden>
                    <button id="attendance-previous" class="attendance-secondary" type="button">Previous</button>
                    <span id="attendance-page-number"></span>
                    <button id="attendance-next" class="attendance-secondary" type="button">Next</button>
                </nav>
            </section>
        </div>
    </main>

    <section id="attendance-edit-bar" class="attendance-edit-bar" aria-label="Attendance editing" hidden>
        <div class="attendance-edit-controls">
            <label class="attendance-field">
                Record as
                <select id="attendance-source">
                    <option value="offline">Physical attendance</option>
                    <option value="manual">Manual correction</option>
                </select>
            </label>
            <p id="attendance-draft-count" role="status">No changes</p>
            <div class="attendance-edit-buttons">
                <button id="cancel-attendance" class="attendance-secondary" type="button">Cancel</button>
                <button id="save-attendance" class="attendance-primary" type="button" disabled>Save</button>
            </div>
        </div>
    </section>
    <script type="module" src="../js/attendance.js"></script>
</body>
</html>
