<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Settings</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/settings.css">

    <link rel="stylesheet" href="../css/access.css">
    <script type="module" src="../js/page-access.js"></script>
</head>

<body data-access="approved">
    <section class="access-status" aria-label="Account access">
        <p role="status">Checking your account…</p>
        <div class="access-status__actions" hidden>
            <button type="button" data-retry>Try again</button>
            <button type="button" data-sign-out>Sign out</button>
        </div>
    </section>

    <!-- Background -->

    <div class="background paper-background"></div>

    <div class="settings-content">

        <!-- Header -->

        <header class="settings-header">

            <button
                class="back-button"
                id="backButton">

                ←

            </button>

            <h1>

                Settings

            </h1>

        </header>



        <!-- ==========================================
             NOTIFICATIONS
        ========================================== -->

        <section class="settings-section">
            <h2>Account</h2>
            <a class="settings-button" href="change-password.html">Change password</a>
            <a class="settings-button" href="forgot-password.html">Reset password</a>
            <button class="settings-button" id="settingsSignOut" type="button">Sign out</button>
            <p id="settingsStatus" role="status"></p>
        </section>

        <section class="settings-section" id="adminSettings" hidden>
            <h2>Class settings</h2>
            <form class="settings-form" id="meetingSettings">
                <label for="meetingUrl">Zoom invitation</label>
                <input id="meetingUrl" type="url" required autocomplete="off">
                <button class="settings-button" type="submit">Save invitation</button>
            </form>
            <h2>Locations</h2>
            <ul class="settings-locations" id="locationList"></ul>
            <form class="settings-form" id="locationSettings">
                <label for="newLocation">Location name</label>
                <input id="newLocation" required maxlength="80">
                <button class="settings-button" type="submit">Add location</button>
            </form>
            <p id="adminSettingsStatus" role="status"></p>
        </section>

    </div>

    <script type="module" src="../js/settings.js"></script>

</body>

</html>
