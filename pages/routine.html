<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Routine | Kayakalp Yogkaksha</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/routine.css">
    <link rel="stylesheet" href="../css/access.css">
    <script type="module" src="../js/page-access.js"></script>
</head>
<body data-access="approved">
    <section class="access-status" aria-label="Account access">
        <p role="status">Checking your account…</p>
        <div class="access-status__actions" hidden>
            <button type="button" data-retry>Try again</button>
            <button type="button" data-sign-out>Sign out</button>
        </div>
    </section>
    <div class="background paper-background" aria-hidden="true"></div>

    <main class="routine-content">
        <header class="routine-header">
            <a class="back-button" href="../index.html" aria-label="Back to home">←</a>
            <h1>Daily Routine</h1>
        </header>

        <p id="routineStatus" class="routine-status" role="status">Loading the routine…</p>
        <button id="editRoutine" class="routine-button" type="button" hidden>Edit routine</button>

        <form id="routineForm" class="routine-editor routine-card" hidden>
            <h2>Edit daily routine</h2>
            <fieldset id="routineEditorFields" aria-label="Routine exercises">
                <div id="routineEditorItems"></div>
                <div class="routine-actions">
                    <button id="addRoutineItem" class="routine-button" type="button">Add exercise</button>
                    <button id="saveRoutine" class="routine-button routine-primary" type="submit">Save routine</button>
                    <button id="cancelRoutine" class="routine-button" type="button">Cancel</button>
                </div>
            </fieldset>
            <p id="routineFormStatus" class="routine-status" role="status"></p>
        </form>

        <div id="routineList"></div>
    </main>

    <template id="routineGroupTemplate">
        <section class="routine-card">
            <h2></h2>
            <ol class="routine-list"></ol>
        </section>
    </template>

    <template id="routineItemTemplate">
        <li>
            <strong class="routine-name"></strong>
            <p class="routine-timing"></p>
            <p class="routine-instructions"></p>
        </li>
    </template>

    <template id="routineEditorTemplate">
        <fieldset class="routine-edit-item">
            <legend></legend>
            <label>
                Exercise name
                <input name="name" maxlength="120" required>
            </label>
            <label>
                Group
                <input name="group" maxlength="80">
            </label>
            <label>
                Duration or time range
                <input name="duration" maxlength="60">
            </label>
            <label>
                Repetitions
                <input name="repetitions" maxlength="60">
            </label>
            <label class="routine-edit-instructions">
                Instructions
                <textarea name="instructions" maxlength="1200" rows="3"></textarea>
            </label>
            <div class="routine-actions">
                <button class="routine-button" type="button" data-move="-1">Move up</button>
                <button class="routine-button" type="button" data-move="1">Move down</button>
                <button class="routine-button routine-remove" type="button">Remove</button>
            </div>
        </fieldset>
    </template>

    <script type="module" src="../js/routine.js"></script>
</body>
</html>
