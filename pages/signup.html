<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/signup.css">

</head>

<body>

<div class="background paper-background"></div>


<main class="signup-page">

    <!-- ==========================================================
         BRAND
    ========================================================== -->

    <section class="brand-section">

        <span class="brand-logo brand-mark" aria-hidden="true">ॐ</span>

        <h1>

            Join

        </h1>

        <h2>

            Kayakalp Yog Kaksha

        </h2>

        <p class="brand-tagline">

            Begin your wellness journey today.

        </p>

    </section>


    <!-- ==========================================================
         SIGNUP CARD
    ========================================================== -->

    <section class="signup-card">

        <h2 class="signup-greeting">

            Create Account

        </h2>

        <p class="signup-description">

            Fill in your details to join Kayakalp Yog Kaksha.

        </p>


        <!-- FULL NAME -->

        <form id="signupForm">
            <div class="input-group">
                <label for="signupPhoto">Profile photo (optional)</label>
                <input id="signupPhoto" type="file" accept="image/jpeg,image/png,image/webp">
            </div>
<div class="input-group">

            <label for="nameInput">Full Name</label>

            <input
                type="text"
                id="nameInput" required autocomplete="name" maxlength="100"
                placeholder="Enter your full name">

        </div>


        <!-- DATE OF BIRTH -->

        <div class="input-group">

            <label for="dobInput">Date of Birth</label>

            <input
                type="date"
                id="dobInput" required autocomplete="bday">

        </div>


        <!-- GENDER -->

        <div class="input-group">

            <label for="genderInput">Gender</label>

            <select id="genderInput" required autocomplete="sex">

                <option value="">Select Gender</option>

                <option>Male</option>

                <option>Female</option>

                <option>Other</option>

            </select>

        </div>


        <!-- PHONE -->

        <div class="input-group">

            <label for="phoneInput">Phone Number</label>

            <input
                type="tel"
                id="phoneInput" required maxlength="10" inputmode="numeric" pattern="[0-9]{10}" autocomplete="tel-national"
                placeholder="Enter phone number">

        </div>


        <!-- EMAIL -->

        <div class="input-group">

            <label for="emailInput">Email Address</label>

            <input
                type="email"
                id="emailInput" required autocomplete="email"
                placeholder="Enter your email">

        </div>


        <!-- ADDRESS -->

        <div class="input-group">

            <label>Address (Optional)</label>

            <textarea
                id="addressInput" autocomplete="street-address" maxlength="500"
                rows="3"
                placeholder="Enter your address"></textarea>

        </div>


        <!-- PARK -->

        <div class="input-group">

            <label for="parkInput">Preferred location</label>

            <select id="parkInput" required>

                <option value="">Select location</option>
            </select>

        </div>


        <!-- HEALTH -->

        <div class="input-group">

            <label>Health Notes (Optional)</label>

            <textarea
                id="healthInput" maxlength="500"
                rows="3"
                placeholder="Asthma, Knee Pain, BP, Back Pain etc."></textarea>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label for="passwordInput">Password</label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="passwordInput" required minlength="6" autocomplete="new-password"
                    placeholder="Create Password">

                <button
                    type="button"
                    id="togglePassword"
                    class="eye-button">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
    <circle cx="12" cy="12" r="3"></circle>
    <path class="password-visibility-slash" d="M3 3l18 18"></path>
</svg>
</button>

            </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="input-group">

            <label for="confirmPasswordInput">Confirm Password</label>

            <input
                type="password"
                id="confirmPasswordInput" required minlength="6" autocomplete="new-password"
                placeholder="Confirm Password">

        </div>


        <!-- ERROR -->

        <p
            id="signupError" role="status"
            class="signup-error">

        </p>


        <!-- BUTTON -->

        <button
            id="signupButton" type="submit"
            class="primary-button">

            <span id="signupButtonText" class="account-button-label">

                Create Account

            </span>

            <span
                id="signupLoader" aria-hidden="true"
                class="button-loader">

            </span>

        </button>
        </form>


        <!-- DIVIDER -->

        <div class="divider">

            <span>

                OR

            </span>

        </div>


        <!-- LOGIN -->

        <button
            id="loginPageButton" type="button"
            class="secondary-button">

            Already have an account? Login

        </button>

    </section>


    <!-- ==========================================================
         FOOTER
    ========================================================== -->

    <footer class="signup-footer">

        <p>

            Your account will be reviewed by the host before it is activated.

        </p>

        <span>

            Version 1.0

        </span>

    </footer>

</main>

<script type="module" src="../js/signup.js"></script>

</body>
</html>
