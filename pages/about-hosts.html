<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About Hosts | Kayakalp Yogkaksha</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/about-hosts.css">
    <link rel="stylesheet" href="../css/access.css">
    <script type="module" src="../js/page-access.js"></script>
</head>
<body data-access="approved">
    <section class="access-status" aria-label="Account access">
        <p role="status">Checking your account…</p>
        <div class="access-status__actions" hidden>
            <button type="button" data-retry>Try again</button>
            <button type="button" data-sign-out>Sign out</button>
        </div>
    </section>
    <div class="background paper-background" aria-hidden="true"></div>

    <main class="about-hosts-content">
        <header class="hosts-header">
            <a class="back-button" href="../index.html" aria-label="Back to home">←</a>
            <h1>About Hosts</h1>
        </header>

        <p id="hostsStatus" class="hosts-status" role="status">Loading host profiles…</p>
        <div id="hostsList"></div>
        <div class="add-bio-section">
            <button id="addBioButton" class="add-bio-button" type="button" hidden>Add host profile</button>
        </div>
    </main>

    <template id="hostCardTemplate">
        <article class="host-card">
            <span class="host-avatar" aria-hidden="true"></span>
            <h2></h2>
            <p class="host-branch"></p>
            <p class="host-experience"></p>
            <p class="host-introduction"></p>
            <div class="host-actions" hidden>
                <button class="edit-host" type="button">Edit</button>
                <button class="delete-host" type="button">Remove</button>
            </div>
        </article>
    </template>

    <dialog id="hostEditor" class="bio-popup" aria-labelledby="hostEditorTitle">
        <h2 id="hostEditorTitle">Add host profile</h2>
        <form id="hostForm">
            <fieldset>
                <label for="hostNameInput">Name</label>
                <input id="hostNameInput" name="hostName" maxlength="120" required>

                <label for="hostLocationInput">Location</label>
                <input id="hostLocationInput" name="hostLocation" list="hostLocationOptions" maxlength="80">
                <datalist id="hostLocationOptions"></datalist>

                <label for="hostExperienceInput">Experience</label>
                <input id="hostExperienceInput" name="hostExperience" maxlength="120">

                <label for="hostIntroductionInput">Introduction</label>
                <textarea id="hostIntroductionInput" name="hostIntroduction" maxlength="1000" rows="4"></textarea>
            </fieldset>

            <p id="hostFormStatus" class="hosts-status" role="status"></p>
            <div class="host-actions">
                <button id="saveBioButton" class="save-host" type="submit">Save</button>
                <button id="cancelBioButton" type="button">Cancel</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="../js/about-hosts.js"></script>
</body>
</html>
