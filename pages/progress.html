<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Progress</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/progress.css">

</head>

<body>
    <h1 style="color:red;">TEST</h1>

    <!-- Background -->

    <div class="background paper-background"></div>

    <div class="progress-content">

        <!-- ==========================================================
             HEADER
        ========================================================== -->

        <header class="progress-header">

            <button
                class="back-button"
                id="backButton">

                ←

            </button>

            <h1>

                Progress

            </h1>

        </header>


        <!-- ==========================================================
             CURRENT STREAK
        ========================================================== -->

        <section class="streak-card">

            <div class="streak-icon">

                🔥

            </div>

            <h2>

                12

            </h2>

            <p>

                Current Streak

            </p>

            <span>

                Days

            </span>

        </section>


        <!-- ==========================================================
             MONTHLY SUMMARY
        ========================================================== -->

        <section class="summary-section">

            <div class="summary-card">

                <div class="summary-icon">

                    📅

                </div>

                <h3>

                    24 / 31

                </h3>

                <p>

                    Attendance

                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">

                    ⏱

                </div>

                <h3>

                    18h 45m

                </h3>

                <p>

                    Yoga Time

                </p>

            </div>

        </section>


        <!-- ==========================================================
             LIFETIME STATS
        ========================================================== -->

        <section class="stats-card">

            <h2>

                📊 Lifetime Statistics

            </h2>

            <hr>

            <div class="stat-row">

                <span>Total Sessions</span>

                <strong>156</strong>

            </div>

            <div class="stat-row">

                <span>Total Hours</span>

                <strong>102h</strong>

            </div>

            <div class="stat-row">

                <span>Longest Streak</span>

                <strong>28 Days</strong>

            </div>

        </section>


        <!-- ==========================================================
             ACHIEVEMENTS
        ========================================================== -->

        <section class="achievement-card">

            <h2>

                🏆 Achievements

            </h2>

            <hr>

            <div class="achievement">

                🥉 First Session

            </div>

            <div class="achievement">

                🥈 7-Day Streak

            </div>

            <div class="achievement locked">

                🔒 30-Day Streak

            </div>

            <div class="achievement locked">

                🔒 100 Hours Practice

            </div>

           <button
    class="view-all-button"
    id="viewAllButton">

    View All →

</button>

        </section>

    </div>

    <script src="../js/progress.js"></script>

</body>

</html>
