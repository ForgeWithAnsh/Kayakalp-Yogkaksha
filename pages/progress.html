<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1">

    <title>Progress</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/progress.css">

    <link rel="stylesheet" href="../css/access.css">
    <script type="module" src="../js/page-access.js"></script>
</head>

<body data-access="approved">
    <section class="access-status" aria-label="Account access">
        <p role="status">Checking your account…</p>
        <div class="access-status__actions" hidden>
            <button type="button" data-retry>Try again</button>
            <button type="button" data-sign-out>Sign out</button>
        </div>
    </section>

    <!-- Background -->

    <div class="background paper-background"></div>

    <div class="progress-content">

        <!-- ==========================================================
             HEADER
        ========================================================== -->

        <header class="progress-header">

            <button
                class="back-button"
                id="backButton">

                ←

            </button>

            <h1>

                Progress

            </h1>

        </header>


        <!-- ==========================================================
             CURRENT STREAK
        ========================================================== -->

        <section class="streak-card">

            <div class="streak-icon">

                🔥

            </div>

            <h2 id="currentStreak">—</h2>

            <p>

                Current Streak

            </p>

            <span>

                Days

            </span>

        </section>


        <!-- ==========================================================
             MONTHLY SUMMARY
        ========================================================== -->

        <section class="summary-section">

            <div class="summary-card">

                <div class="summary-icon">

                    📅

                </div>

                <h3 id="monthlyAttendance">—</h3>

                <p>

                    Attendance

                </p>

            </div>


            <div class="summary-card">

                <div class="summary-icon">

                    ⏱

                </div>

                <h3 id="monthlyPractice">—</h3>

                <p>

                    Yoga Time

                </p>

            </div>

        </section>


        <!-- ==========================================================
             LIFETIME STATS
        ========================================================== -->

        <section class="stats-card">

            <h2>

                📊 Lifetime Statistics

            </h2>

            <hr>

            <div class="stat-row">

                <span>Total Sessions</span>

                <strong id="lifetimeSessions">—</strong>

            </div>

            <div class="stat-row">

                <span>Total Hours</span>

                <strong id="lifetimeHours">—</strong>

            </div>

            <div class="stat-row">

                <span>Longest Streak</span>

                <strong id="longestStreak">—</strong>

            </div>

        </section>


        <!-- ==========================================================
             ACHIEVEMENTS
        ========================================================== -->

        <section class="stats-card" aria-labelledby="attendanceHistoryTitle">
            <h2 id="attendanceHistoryTitle">Attendance history</h2>
            <p id="attendanceHistoryStatus" role="status"></p>
            <ul class="attendance-history" id="attendanceHistory"></ul>
            <button class="view-all-button" id="moreAttendance" type="button" hidden>Show more dates</button>
        </section>

        <section class="achievement-card">

            <h2>

                🏆 Achievements

            </h2>

            <hr>

            <div id="progressAchievements"></div>
            <p id="progressStatus" role="status"></p>

        </section>

    </div>

    <script type="module" src="../js/progress.js"></script>

</body>

</html>
