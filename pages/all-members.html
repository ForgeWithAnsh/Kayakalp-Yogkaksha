<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Members | Kayakalp Yogkaksha</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/all-members.css">
    <link rel="stylesheet" href="../css/access.css">
    <script type="module" src="../js/page-access.js"></script>
</head>
<body data-access="staff">
    <section class="access-status" aria-label="Account access">
        <p role="status">Checking your account…</p>
        <div class="access-status__actions" hidden>
            <button type="button" data-retry>Try again</button>
            <button type="button" data-sign-out>Sign out</button>
        </div>
    </section>
    <div class="background paper-background" aria-hidden="true"></div>

    <main class="all-members-page">
        <header class="members-header">
            <a class="back-button" href="../index.html" aria-label="Back to home">←</a>
            <div>
                <h1>All Members</h1>
                <p>Manage approved members</p>
            </div>
        </header>

        <section class="member-filters" aria-label="Member filters">
            <label class="member-search" for="searchInput">
                Search by name or member ID
                <input id="searchInput" type="search" placeholder="Search members">
            </label>
            <label for="locationSelect">
                Location
                <select id="locationSelect">
                    <option value="">All Locations</option>
                </select>
            </label>
            <label for="memberRoleSelect">
                Role
                <select id="memberRoleSelect">
                    <option value="">All Roles</option>
                    <option value="admin">Admin</option>
                    <option value="host">Host</option>
                    <option value="moderator">Moderator</option>
                    <option value="member">Member</option>
                </select>
            </label>
            <label for="sortSelect">
                Sort by
                <select id="sortSelect">
                    <option value="az">Name (A–Z)</option>
                    <option value="za">Name (Z–A)</option>
                    <option value="newest">Newest Joined</option>
                    <option value="oldest">Oldest Joined</option>
                    <option value="memberid">Member ID</option>
                </select>
            </label>
        </section>

        <p id="memberListStatus" class="member-list-status" role="status">Loading members…</p>
        <button id="retryMembers" class="member-secondary-button" type="button" hidden>Try again</button>
        <div id="membersContainer" class="members-container"></div>
    </main>

    <template id="memberCardTemplate">
        <button class="member-card" type="button">
            <span class="member-photo" aria-hidden="true"></span>
            <span class="member-info">
                <span class="member-name"></span>
                <span class="member-id"></span>
            </span>
        </button>
    </template>

    <dialog id="memberProfileOverlay" class="member-profile-dialog" aria-labelledby="profileName">
        <div class="member-profile-sheet">
            <button id="closeMemberProfile" class="manage-close-button profile-close-button" type="button" aria-label="Close profile">×</button>
            <div class="sheet-handle" aria-hidden="true"></div>
            <header class="profile-header">
                <span id="profileAvatar" class="profile-avatar" aria-hidden="true"></span>
                <h2 id="profileName"></h2>
                <p id="profileRole" class="profile-role"></p>
                <p id="profileMemberId" class="profile-member-id"></p>
            </header>
            <dl class="profile-details">
                <div class="detail-row"><dt>Phone</dt><dd id="profilePhone"></dd></div>
                <div class="detail-row"><dt>Gender</dt><dd id="profileGender"></dd></div>
                <div class="detail-row"><dt>Date of birth</dt><dd id="profileDob"></dd></div>
                <div class="detail-row"><dt>Age</dt><dd id="profileAge"></dd></div>
                <div class="detail-row"><dt>Location</dt><dd id="profilePark"></dd></div>
                <div class="detail-row"><dt>Health information</dt><dd id="profileHealth"></dd></div>
                <div class="detail-row"><dt>Email</dt><dd id="profileEmail"></dd></div>
                <div class="detail-row"><dt>Address</dt><dd id="profileAddress"></dd></div>
                <div class="detail-row"><dt>Joined</dt><dd id="profileJoined"></dd></div>
            </dl>
            <button id="manageMemberButton" class="manage-member-button" type="button" hidden>Change role</button>
        </div>
    </dialog>

    <dialog id="managePopupOverlay" class="manage-popup" aria-labelledby="manageTitle">
        <header class="manage-popup-header">
            <div>
                <h2 id="manageTitle">Change role</h2>
                <p id="manageMemberName"></p>
            </div>
            <button id="closeManagePopup" class="manage-close-button" type="button" aria-label="Close role editor">×</button>
        </header>
        <form id="memberRoleForm">
            <p id="currentRoleCard" class="current-role-card"></p>
            <fieldset id="roleOptions" class="role-options">
                <legend>New role</legend>
            </fieldset>
            <p id="memberRoleStatus" class="member-list-status" role="status"></p>
            <button id="saveChangesButton" class="save-changes-button" type="submit" disabled>Save role</button>
        </form>
    </dialog>

    <script type="module" src="../js/all-members.js"></script>
</body>
</html>
