<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Forgot Password

    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/forgot-password.css">

</head>

<body>

<div class="background paper-background"></div>

<main class="forgot-page">

    <button
        id="backButton"
        class="back-button">

        ← Back

    </button>

    <section class="forgot-card">

        <img
            src="../assets/logo.png"
            class="forgot-logo"
            alt="Logo">

        <h1>

            Forgot Password

        </h1>

        <p class="forgot-description">

            Enter your registered email address.

            We'll send you a password reset link.

        </p>

        <div class="input-group">

            <label>

                Email Address

            </label>

            <input
                type="email"
                id="emailInput"
                placeholder="Enter your email">

        </div>

        <p
            id="message"
            class="message">

        </p>

        <button
            id="sendButton"
            class="primary-button">

            <span
                id="buttonText">

                Send Reset Link

            </span>

            <span
                id="buttonLoader"
                class="button-loader">

            </span>

        </button>

        <div class="divider">

            <span>

                OR

            </span>

        </div>

        <button
            id="loginButton"
            class="secondary-button">

            Back To Login

        </button>

    </section>

</main>

<script
    type="module"
    src="../js/forgot-password.js">

</script>

</body>

</html>
