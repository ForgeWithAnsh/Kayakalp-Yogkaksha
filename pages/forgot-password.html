<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Forgot Password

    </title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/forgot-password.css">

</head>

<body>

<div class="background paper-background"></div>

<main class="forgot-page">

    <button
        id="backButton" type="button"
        class="back-button">

        ← Back

    </button>

    <section class="forgot-card">

        <span class="forgot-logo brand-mark" aria-hidden="true">ॐ</span>

        <h1>

            Forgot Password

        </h1>

        <p class="forgot-description">

            Enter your registered email address.

            We'll send you a password reset link.

        </p>

        <form id="resetForm">
<div class="input-group">

            <label for="emailInput">

                Email Address

            </label>

            <input
                type="email"
                id="emailInput" required autocomplete="email"
                placeholder="Enter your email">

        </div>

        <p
            id="message" role="status"
            class="message">

        </p>

        <button
            id="sendButton" type="submit"
            class="primary-button">

            <span
                id="buttonText" class="account-button-label">

                Send Reset Link

            </span>

            <span
                id="buttonLoader" aria-hidden="true"
                class="button-loader">

            </span>

        </button>
        </form>

        <div class="divider">

            <span>

                OR

            </span>

        </div>

        <button
            id="loginButton" type="button"
            class="secondary-button">

            Back To Login

        </button>

    </section>

</main>

<script
    type="module"
    src="../js/forgot-password.js">

</script>

</body>

</html>
